name: Aggiorna Classifiche CSI

on:
  schedule:
    # Esegue lo script ogni giorno alle 10:00 ora italiana (09:00 UTC)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permette anche l'avvio manuale quando serve

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa le dipendenze
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crea il file credentials.json in modo sicuro
        env:
          GCP_CREDS_CONTENT: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python -c 'import os; open("credentials.json", "w", encoding="utf-8").write(os.environ["GCP_CREDS_CONTENT"])'

      - name: Esegui lo script Python di aggiornamento
        run: python aggiorna_classifiche.py
